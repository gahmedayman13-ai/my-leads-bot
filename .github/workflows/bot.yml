name: Run Telegram Bot
on:
  schedule:
    - cron: '0 * * * *' # بيشتغل كل ساعة
  workflow_dispatch: # عشان تقدر تشغله بإيدك

permissions:
  contents: write # أهم سطر عشان البوت يقدر يحفظ وقت آخر وظيفة

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6 # النسخة الأحدث
      
      - name: Setup Node.js
        uses: actions/setup-node@v6 # النسخة الأحدث
        with:
          node-version: '20'
          
      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROUP_ID: ${{ secrets.GROUP_ID }}
        run: node bot.js
